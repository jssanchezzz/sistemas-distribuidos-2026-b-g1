# Security gates proposed for the pull requests of opti-sales-api (Java 21, Maven).
# Three gates: secret scanning, dependency audit and the negative authorization tests.
name: security

on:
  pull_request:
    branches: [develop, qa, main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Dependency audit (OWASP dependency-check)
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7

  authorization-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Negative authorization tests
        run: mvn -B test -Dtest='*AuthzTest'
